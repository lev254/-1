<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка - Управление меню</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #eee;
            padding: 30px;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 1000px; width: 100%; }
        h1 { color: #f5e37a; margin-bottom: 20px; font-size: 2rem; }
        .login-box {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #444;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .login-box button {
            padding: 12px 30px;
            background: #f5e37a;
            color: #1a1a1a;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
        }
        .panel {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #444;
        }
        .panel h2 { color: #f5e37a; font-size: 1.4rem; margin-bottom: 15px; }
        .panel label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 0.95rem; }
        .panel input, .panel select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
        }
        .panel button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            background: #f5e37a;
            color: #1a1a1a;
            margin-right: 8px;
        }
        .btn-danger { background: #c62828 !important; color: #fff !important; }
        .btn-secondary { background: #555 !important; color: #fff !important; }
        .category-item {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #f5e37a;
        }
        .category-item h3 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .category-item h3 span { color: #f5e37a; }
        .preset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .preset-item .url { font-size: 0.85rem; color: #aaa; word-break: break-all; flex: 1; margin-right: 10px; }
        .preset-item .del {
            background: #c62828;
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: 700;
        }
        .add-preset {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .add-preset input { flex: 2; min-width: 200px; }
        .add-preset button { flex: 0 0 auto; }
        .code-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .code-item .code { font-weight: 700; color: #f5e37a; }
        .code-item .del {
            background: #c62828;
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: 700;
        }
        .add-code {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .add-code input { flex: 2; min-width: 200px; }
        .add-code button { flex: 0 0 auto; }
        .logout-btn {
            float: right;
            background: #555;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #2a2a2a;
            color: #aaa;
            font-size: 0.9rem;
        }
        .status.success { color: #8bc34a; }
        .status.error { color: #ef5350; }
        .hidden { display: none; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>🔐 Админка меню</h1>
        <div id="loginArea">
            <div class="login-box">
                <h2>Вход</h2>
                <input type="password" id="passInput" placeholder="Введите пароль" />
                <button id="loginBtn">Войти</button>
                <div style="margin-top:10px; color:#888; font-size:0.9rem;">Пароль: <strong>Лев777</strong></div>
            </div>
        </div>

        <div id="adminArea" class="hidden">
            <div class="flex-between" style="margin-bottom:10px;">
                <span style="color:#aaa;">Добро пожаловать, админ!</span>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>

            <!-- Управление категориями и фонами -->
            <div class="panel">
                <h2>📁 Категории и фоны</h2>
                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px;">
                    <input type="text" id="newCategoryName" placeholder="Название категории (например, Пиццерия)" style="flex:2; min-width:200px;" />
                    <button id="addCategoryBtn">➕ Добавить категорию</button>
                </div>
                <div id="categoriesList"></div>
            </div>

            <!-- Управление кодами активации -->
            <div class="panel">
                <h2>🔑 Коды активации</h2>
                <p style="color:#aaa; font-size:0.9rem; margin-bottom:10px;">Добавленные коды работают для всех пользователей конструктора.</p>
                <div class="add-code">
                    <input type="text" id="newCodeInput" placeholder="Новый код (например, VIP2025)" />
                    <button id="addCodeBtn">➕ Добавить код</button>
                </div>
                <div id="codesList" style="margin-top:12px;"></div>
            </div>

            <div id="status" class="status">Готово</div>
        </div>
    </div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        // ВСТАВЬТЕ СВОЙ КОНФИГ ЗДЕСЬ:
        const firebaseConfig = {
            apiKey: "ВАШ_API_KEY",
            authDomain: "ВАШ_ПРОЕКТ.firebaseapp.com",
            databaseURL: "https://ВАШ_ПРОЕКТ-default-rtdb.firebaseio.com",
            projectId: "ВАШ_ПРОЕКТ",
            storageBucket: "ВАШ_ПРОЕКТ.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==================== ПЕРЕМЕННЫЕ ====================
        const ADMIN_PASSWORD = 'Лев777';
        let isLoggedIn = false;

        // ==================== ДОМ-ЭЛЕМЕНТЫ ====================
        const loginArea = document.getElementById('loginArea');
        const adminArea = document.getElementById('adminArea');
        const passInput = document.getElementById('passInput');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const newCategoryName = document.getElementById('newCategoryName');
        const addCategoryBtn = document.getElementById('addCategoryBtn');
        const categoriesList = document.getElementById('categoriesList');
        const newCodeInput = document.getElementById('newCodeInput');
        const addCodeBtn = document.getElementById('addCodeBtn');
        const codesList = document.getElementById('codesList');
        const statusDiv = document.getElementById('status');

        // ==================== ВСПОМОГАТЕЛЬНЫЕ ====================
        function setStatus(msg, isError = false) {
            statusDiv.textContent = msg;
            statusDiv.className = 'status' + (isError ? ' error' : ' success');
            setTimeout(() => { statusDiv.className = 'status'; }, 4000);
        }

        // ==================== УПРАВЛЕНИЕ КАТЕГОРИЯМИ И ФОНАМИ ====================
        function loadCategories() {
            db.ref('bg_categories').once('value').then(snapshot => {
                const data = snapshot.val() || {};
                renderCategories(data);
            }).catch(err => setStatus('Ошибка загрузки: ' + err.message, true));
        }

        function renderCategories(data) {
            categoriesList.innerHTML = '';
            for (const [key, category] of Object.entries(data)) {
                const div = document.createElement('div');
                div.className = 'category-item';
                div.innerHTML = `
                    <h3>
                        <span>${category.label || key}</span>
                        <button class="btn-danger" data-key="${key}" data-action="deleteCategory">Удалить</button>
                    </h3>
                    <div class="presets-list">
                        ${category.presets ? Object.entries(category.presets).map(([pKey, url]) => `
                            <div class="preset-item">
                                <span class="url">${url}</span>
                                <button class="del" data-cat="${key}" data-preset="${pKey}" data-action="deletePreset">✕</button>
                            </div>
                        `).join('') : '<div style="color:#888; font-size:0.9rem;">Нет фонов</div>'}
                    </div>
                    <div class="add-preset">
                        <input type="text" placeholder="URL картинки (фон)" data-cat="${key}" class="preset-url-input" />
                        <button data-cat="${key}" data-action="addPreset">➕ Добавить фон</button>
                    </div>
                `;
                categoriesList.appendChild(div);
            }

            // Обработчики
            document.querySelectorAll('[data-action="deleteCategory"]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const key = this.dataset.key;
                    if (confirm(`Удалить категорию "${key}" вместе со всеми фонами?`)) {
                        db.ref('bg_categories/' + key).remove().then(() => {
                            setStatus('Категория удалена');
                            loadCategories();
                        }).catch(err => setStatus('Ошибка: ' + err.message, true));
                    }
                });
            });

            document.querySelectorAll('[data-action="deletePreset"]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const cat = this.dataset.cat;
                    const preset = this.dataset.preset;
                    if (confirm('Удалить этот фон?')) {
                        db.ref('bg_categories/' + cat + '/presets/' + preset).remove().then(() => {
                            setStatus('Фон удалён');
                            loadCategories();
                        }).catch(err => setStatus('Ошибка: ' + err.message, true));
                    }
                });
            });

            document.querySelectorAll('[data-action="addPreset"]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const cat = this.dataset.cat;
                    const input = this.parentElement.querySelector('.preset-url-input');
                    const url = input.value.trim();
                    if (!url) { setStatus('Введите URL картинки', true); return; }
                    const key = 'p' + Date.now();
                    db.ref('bg_categories/' + cat + '/presets/' + key).set(url).then(() => {
                        setStatus('Фон добавлен!');
                        input.value = '';
                        loadCategories();
                    }).catch(err => setStatus('Ошибка: ' + err.message, true));
                });
            });
        }

        addCategoryBtn.addEventListener('click', function() {
            const name = newCategoryName.value.trim();
            if (!name) { setStatus('Введите название категории', true); return; }
            const key = name.toLowerCase().replace(/\s+/g, '_');
            db.ref('bg_categories/' + key).set({
                label: name,
                presets: {}
            }).then(() => {
                setStatus('Категория добавлена!');
                newCategoryName.value = '';
                loadCategories();
            }).catch(err => setStatus('Ошибка: ' + err.message, true));
        });

        // ==================== УПРАВЛЕНИЕ КОДАМИ АКТИВАЦИИ ====================
        function loadCodes() {
            db.ref('activation_codes').once('value').then(snapshot => {
                const data = snapshot.val() || {};
                renderCodes(data);
            }).catch(err => setStatus('Ошибка загрузки кодов: ' + err.message, true));
        }

        function renderCodes(data) {
            codesList.innerHTML = '';
            if (Object.keys(data).length === 0) {
                codesList.innerHTML = '<div style="color:#888; font-size:0.9rem;">Нет кодов. Добавьте первый!</div>';
                return;
            }
            for (const [key, code] of Object.entries(data)) {
                const div = document.createElement('div');
                div.className = 'code-item';
                div.innerHTML = `
                    <span class="code">${code}</span>
                    <button class="del" data-key="${key}" data-action="deleteCode">✕</button>
                `;
                codesList.appendChild(div);
            }
            // Обработчик удаления
            document.querySelectorAll('[data-action="deleteCode"]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const key = this.dataset.key;
                    if (confirm('Удалить код?')) {
                        db.ref('activation_codes/' + key).remove().then(() => {
                            setStatus('Код удалён');
                            loadCodes();
                        }).catch(err => setStatus('Ошибка: ' + err.message, true));
                    }
                });
            });
        }

        addCodeBtn.addEventListener('click', function() {
            const code = newCodeInput.value.trim().toUpperCase();
            if (!code) { setStatus('Введите код', true); return; }
            // Используем код как ключ (удаление по коду)
            db.ref('activation_codes/' + code).set(code).then(() => {
                setStatus('Код добавлен!');
                newCodeInput.value = '';
                loadCodes();
            }).catch(err => setStatus('Ошибка: ' + err.message, true));
        });

        // ==================== ИНИЦИАЛИЗАЦИЯ НАЧАЛЬНЫХ КОДОВ ====================
        function initDefaultCodes() {
            // Проверяем, есть ли уже коды
            db.ref('activation_codes').once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    // Создаём стандартные коды из конструктора
                    const defaultCodes = [
                        'ШЕФ2026', 'LEV777', 'MENU2026', 'CHEF1', 'LEV2026',
                        'MASTER', 'GRILL', 'STEAK', 'PIZZA', 'PASTA',
                        'SALAD', 'SOUP', 'FISH', 'MEAT', 'VEGAN',
                        'BBQ', 'WOK', 'SUSHI', 'BURGER', 'TACO'
                    ];
                    const updates = {};
                    defaultCodes.forEach(code => { updates[code] = code; });
                    db.ref('activation_codes').set(updates).then(() => {
                        console.log('Стандартные коды добавлены в Firebase');
                        loadCodes();
                    }).catch(err => console.warn('Ошибка инициализации кодов:', err));
                } else {
                    loadCodes();
                }
            }).catch(err => console.warn('Ошибка проверки кодов:', err));
        }

        // ==================== ВХОД / ВЫХОД ====================
        loginBtn.addEventListener('click', function() {
            const pass = passInput.value;
            if (pass === ADMIN_PASSWORD) {
                isLoggedIn = true;
                loginArea.classList.add('hidden');
                adminArea.classList.remove('hidden');
                loadCategories();
                initDefaultCodes(); // загрузит коды и при необходимости создаст
                setStatus('Добро пожаловать!');
            } else {
                setStatus('Неверный пароль', true);
            }
        });

        passInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loginBtn.click();
        });

        logoutBtn.addEventListener('click', function() {
            isLoggedIn = false;
            adminArea.classList.add('hidden');
            loginArea.classList.remove('hidden');
            passInput.value = '';
            setStatus('Вы вышли');
        });
    </script>
</body>
</html>
