<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка — Конструктор меню</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e1e1e;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
        h1 {
            color: #f5e37a;
            font-weight: 400;
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 0.95rem; }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 350px;
            margin: 0 auto;
        }
        .login-form input {
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 1rem;
        }
        .login-form input:focus { border-color: #f5e37a; outline: none; }
        .login-form button {
            padding: 12px;
            border: none;
            border-radius: 30px;
            background: #f5a623;
            color: #1a1a1a;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-form button:hover { transform: scale(1.02); filter: brightness(1.1); }
        .error-msg { color: #ff6b6b; text-align: center; margin-top: 10px; display: none; }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        .section {
            background: #252525;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #333;
        }
        .section h2 {
            color: #f5e37a;
            font-weight: 400;
            font-size: 1.4rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .section .row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .section input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 0.95rem;
            min-width: 150px;
        }
        .section input[type="text"]:focus { border-color: #f5e37a; outline: none; }
        .section .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: #fff;
            background: #3a6ea5;
        }
        .section .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-add { background: #2e7d32; }
        .btn-remove { background: #c62828; }
        .btn-logout { background: #555; margin-top: 20px; width: 100%; }
        .list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .list .item {
            background: #333;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            border: 1px solid #555;
        }
        .list .item .del {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
            padding: 0 4px;
        }
        .list .item .del:hover { transform: scale(1.2); }
        .bg-url-list .item { max-width: 100%; word-break: break-all; }
        .bg-url-list .item .url-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bg-url-list .item .del { flex-shrink: 0; }
        select { 
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 0.95rem;
            min-width: 120px;
        }
        .hint { color: #aaa; font-size: 0.8rem; margin-top: 4px; }
        .status { color: #8bc34a; text-align: center; margin: 10px 0; }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .section .row { flex-direction: column; }
            .section input[type="text"] { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Администрирование</h1>
        <p class="subtitle">Управление фонами и кодами активации</p>

        <!-- Форма входа -->
        <div id="loginForm" class="login-form">
            <input type="password" id="passwordInput" placeholder="Введите пароль" />
            <button id="loginBtn">Войти</button>
            <div class="error-msg" id="loginError">Неверный пароль</div>
        </div>

        <!-- Админ-панель -->
        <div id="adminPanel" class="admin-panel">
            <!-- Категории -->
            <div class="section">
                <h2>📂 Категории фонов</h2>
                <div class="row">
                    <input type="text" id="newCategoryInput" placeholder="Название категории (например, sushi)" />
                    <button class="btn btn-add" id="addCategoryBtn">Добавить</button>
                </div>
                <div id="categoryList" class="list"></div>
            </div>

            <!-- Фоны -->
            <div class="section">
                <h2>🖼 Фоны</h2>
                <div class="row">
                    <select id="categorySelectForBg"></select>
                </div>
                <div class="row">
                    <input type="text" id="newBgUrlInput" placeholder="URL изображения" />
                    <button class="btn btn-add" id="addBgBtn">Добавить фон</button>
                </div>
                <div id="bgList" class="list bg-url-list"></div>
            </div>

            <!-- Коды активации -->
            <div class="section">
                <h2>🔑 Коды активации</h2>
                <div class="row">
                    <input type="text" id="newCodeInput" placeholder="Новый код (например, MASTER2026)" />
                    <button class="btn btn-add" id="addCodeBtn">Добавить код</button>
                </div>
                <div id="codeList" class="list"></div>
            </div>

            <button class="btn btn-logout" id="logoutBtn">🚪 Выйти</button>
        </div>
    </div>

    <script>
        // ======================== КОНФИГ FIREBASE (ВАШ) ========================
        const firebaseConfig = {
            apiKey: "AIzaSyBjAz_C2j5uT-oDYgSmgt1uu45wklnp7V8",
            authDomain: "menu-3ac7e.firebaseapp.com",
            databaseURL: "https://menu-3ac7e-default-rtdb.firebaseio.com",
            projectId: "menu-3ac7e",
            storageBucket: "menu-3ac7e.firebasestorage.app",
            messagingSenderId: "1045961578696",
            appId: "1:1045961578696:web:4a2eed582dcbc377396dfd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ======================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ========================
        let bgCategories = [];
        let bgPresets = {};
        let validCodes = [];

        // ======================== АВТОРИЗАЦИЯ ========================
        const PASSWORD = 'Лев777';

        document.getElementById('loginBtn').addEventListener('click', function() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === PASSWORD) {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('loginError').style.display = 'none';
                loadData();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            document.getElementById('loginForm').style.display = 'flex';
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('passwordInput').value = '';
        });

        // ======================== ЗАГРУЗКА ДАННЫХ ========================
        function loadData() {
            // Категории
            db.ref('bgCategories').on('value', snap => {
                const val = snap.val();
                bgCategories = (val && Array.isArray(val)) ? val : [];
                renderCategories();
                populateCategorySelect();
                const selectedCat = document.getElementById('categorySelectForBg').value;
                if (selectedCat) renderBgList(selectedCat);
            });

            // Пресеты фонов
            db.ref('bgPresets').on('value', snap => {
                const val = snap.val();
                bgPresets = (val && typeof val === 'object') ? val : {};
                const selectedCat = document.getElementById('categorySelectForBg').value;
                if (selectedCat) renderBgList(selectedCat);
            });

            // Коды активации
            db.ref('validCodes').on('value', snap => {
                const val = snap.val();
                validCodes = (val && Array.isArray(val)) ? val : [];
                renderCodes();
            });
        }

        // ======================== ОТОБРАЖЕНИЕ КАТЕГОРИЙ ========================
        function renderCategories() {
            const container = document.getElementById('categoryList');
            container.innerHTML = '';
            if (bgCategories.length === 0) {
                container.innerHTML = '<span style="color:#888;">Нет категорий</span>';
                return;
            }
            bgCategories.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'item';
                div.textContent = cat;
                const delBtn = document.createElement('button');
                delBtn.className = 'del';
                delBtn.textContent = '×';
                delBtn.addEventListener('click', () => removeCategory(cat));
                div.appendChild(delBtn);
                container.appendChild(div);
            });
        }

        function populateCategorySelect() {
            const select = document.getElementById('categorySelectForBg');
            const currentVal = select.value;
            select.innerHTML = '';
            bgCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
            if (currentVal && bgCategories.includes(currentVal)) {
                select.value = currentVal;
            } else if (bgCategories.length > 0) {
                select.value = bgCategories[0];
            }
            renderBgList(select.value);
        }

        // ======================== ДОБАВЛЕНИЕ / УДАЛЕНИЕ КАТЕГОРИЙ ========================
        document.getElementById('addCategoryBtn').addEventListener('click', function() {
            const input = document.getElementById('newCategoryInput');
            const name = input.value.trim();
            if (!name) { alert('Введите название категории.'); return; }
            if (bgCategories.includes(name)) { alert('Такая категория уже существует.'); return; }
            const newList = [...bgCategories, name];
            db.ref('bgCategories').set(newList).then(() => {
                input.value = '';
                bgPresets[name] = [];
                db.ref('bgPresets').set(bgPresets);
            }).catch(err => alert('Ошибка: ' + err.message));
        });

        function removeCategory(cat) {
            if (!confirm(`Удалить категорию "${cat}" вместе со всеми фонами?`)) return;
            const newList = bgCategories.filter(c => c !== cat);
            db.ref('bgCategories').set(newList);
            delete bgPresets[cat];
            db.ref('bgPresets').set(bgPresets);
        }

        // ======================== ОТОБРАЖЕНИЕ ФОНОВ ========================
        function renderBgList(category) {
            const container = document.getElementById('bgList');
            container.innerHTML = '';
            if (!category) {
                container.innerHTML = '<span style="color:#888;">Выберите категорию</span>';
                return;
            }
            const urls = bgPresets[category] || [];
            if (urls.length === 0) {
                container.innerHTML = '<span style="color:#888;">Нет фонов в этой категории</span>';
                return;
            }
            urls.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'item';
                const span = document.createElement('span');
                span.className = 'url-text';
                span.textContent = url.length > 50 ? url.slice(0, 50) + '…' : url;
                span.title = url;
                const delBtn = document.createElement('button');
                delBtn.className = 'del';
                delBtn.textContent = '×';
                delBtn.addEventListener('click', () => removeBg(category, index));
                div.appendChild(span);
                div.appendChild(delBtn);
                container.appendChild(div);
            });
        }

        // ======================== ДОБАВЛЕНИЕ / УДАЛЕНИЕ ФОНОВ ========================
        document.getElementById('addBgBtn').addEventListener('click', function() {
            const category = document.getElementById('categorySelectForBg').value;
            if (!category) { alert('Выберите категорию.'); return; }
            const input = document.getElementById('newBgUrlInput');
            const url = input.value.trim();
            if (!url) { alert('Введите URL изображения.'); return; }
            if (!bgPresets[category]) bgPresets[category] = [];
            bgPresets[category].push(url);
            db.ref('bgPresets').set(bgPresets).then(() => {
                input.value = '';
            }).catch(err => alert('Ошибка: ' + err.message));
        });

        function removeBg(category, index) {
            if (!confirm('Удалить этот фон?')) return;
            const urls = bgPresets[category] || [];
            urls.splice(index, 1);
            bgPresets[category] = urls;
            db.ref('bgPresets').set(bgPresets);
        }

        document.getElementById('categorySelectForBg').addEventListener('change', function() {
            renderBgList(this.value);
        });

        // ======================== ОТОБРАЖЕНИЕ КОДОВ ========================
        function renderCodes() {
            const container = document.getElementById('codeList');
            container.innerHTML = '';
            if (validCodes.length === 0) {
                container.innerHTML = '<span style="color:#888;">Нет кодов</span>';
                return;
            }
            validCodes.forEach((code, index) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.textContent = code;
                const delBtn = document.createElement('button');
                delBtn.className = 'del';
                delBtn.textContent = '×';
                delBtn.addEventListener('click', () => removeCode(index));
                div.appendChild(delBtn);
                container.appendChild(div);
            });
        }

        // ======================== ДОБАВЛЕНИЕ / УДАЛЕНИЕ КОДОВ ========================
        document.getElementById('addCodeBtn').addEventListener('click', function() {
            const input = document.getElementById('newCodeInput');
            const code = input.value.trim();
            if (!code) { alert('Введите код.'); return; }
            if (validCodes.includes(code)) { alert('Такой код уже существует.'); return; }
            const newCodes = [...validCodes, code];
            db.ref('validCodes').set(newCodes).then(() => {
                input.value = '';
            }).catch(err => alert('Ошибка: ' + err.message));
        });

        function removeCode(index) {
            if (!confirm('Удалить этот код?')) return;
            const newCodes = validCodes.filter((_, i) => i !== index);
            db.ref('validCodes').set(newCodes);
        }

        console.log('Админка загружена. Введите пароль для входа.');
    </script>
</body>
</html>
